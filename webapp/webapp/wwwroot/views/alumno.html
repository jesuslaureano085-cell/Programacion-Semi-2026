<form id="frmAlumno">
    <div class="card theme-secondary" style="min-width:700px;">
        <div class="card-header">
            <div class="d-flex">
                Administracion de Alumnos

                <div class="ms-auto">
                    <button data-form="alumno" type="button" class="btn-close" aria-label="Close"></button>
                </div>
            </div>
        </div>
        <div class="card-body">
            <div class="row p-1">
                <div class="col-3 col-md-2">CODIGO</div>
                <div class="col-9 col-md-4">
                    <input type="text" class="form-control" id="txtCodigoAlumno" name="txtCodigoAlumno" required />
                </div>
            </div>
            <div class="row p-1">
                <div class="col-3 col-md-2">NOMBRE</div>
                <div class="col-9 col-md-8">
                    <input type="text" class="form-control" id="txtNombreAlumno" name="txtNombreAlumno" required />
                </div>
            </div>
            <div class="row p-1">
                <div class="col-3 col-md-2">DIRECCION</div>
                <div class="col-9 col-md-10">
                    <input type="text" class="form-control" id="txtDireccionAlumno" name="txtDireccionAlumno" />
                </div>
            </div>
            <div class="row p-1">
                <div class="col-3 col-md-2">TELEFONO</div>
                <div class="col-9 col-md-4">
                    <input type="text" class="form-control" id="txtTelefonoAlumno" name="txtTelefonoAlumno" />
                </div>
            </div>
            <div class="row p-1">
                <div class="col-3 col-md-2">EMAIL</div>
                <div class="col-9 col-md-6">
                    <input type="email" class="form-control" id="txtEmailAlumno" name="txtEmailAlumno" />
                </div>
            </div>
        </div>
        <div class="card-footer fg-2">
            <div class="col-12 text-center">
                <input type="submit" class="btn btn-outline-primary" value="Guardar" />
                <input type="reset" class="btn btn-outline-warning" value="Nuevo" />
                <!-- "Buscar" todavía no hace nada: lo hará la pantalla busqueda_alumno -->
                <input type="button" class="btn btn-outline-success" value="Buscar" />
            </div>
        </div>
    </div>
</form>
<script>
var accion = 'nuevo',   // 'nuevo' = crear (POST) | 'modificar' = editar (PUT)
    idAlumno = 0;

frmAlumno.addEventListener('submit', e => {
    e.preventDefault();          // evita que la página se recargue
    guardarAlumno();
});

frmAlumno.addEventListener('reset', () => {
    accion = 'nuevo';            // botón "Nuevo": vuelve a modo crear
    idAlumno = 0;
});

async function guardarAlumno() {
    let datos = {
            codigo: txtCodigoAlumno.value,
            nombre: txtNombreAlumno.value,
            direccion: txtDireccionAlumno.value,
            telefono: txtTelefonoAlumno.value,
            email: txtEmailAlumno.value,
        },
        url = '/api/Alumnos',
        method = 'POST';

    if (accion == 'modificar') {
        method = 'PUT';
        url = `/api/Alumnos/${idAlumno}`;
        datos.idAlumno = idAlumno;
    }

    try {
        const respuesta = await fetch(url, {
            method,
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(datos)
        });

        if (!respuesta.ok) {
            throw new Error(`el servidor respondió ${respuesta.status}`);
        }

        alertify.success('Alumno guardado correctamente');
        frmAlumno.reset();
    } catch (error) {
        alertify.error(`No se pudo guardar: ${error.message}`);
    }
}
</script>
